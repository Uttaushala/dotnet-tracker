name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Опубликовать APK в Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tracker.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Трекер .NET (APK)" --notes "Свежая сборка. Скачай tracker.apk и открой на телефоне."
          gh release upload apk-latest tracker.apk --clobber
