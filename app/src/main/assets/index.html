function weekStats(w){
  var d=state.done[wid(w.n)]||{},req=0,rd=0,op=0,od=0,ht=0,hd=0,hk=true;
  w.tasks.forEach(function(t,i){
    var on=!!d["t"+(i+1)];
    if(t.s){op++;if(on)od++}
    else{req++;if(on)rd++;if(t.h==null)hk=false;else{ht+=t.h;if(on)hd+=t.h}}
  });
  return {req:req,rd:rd,op:op,od:od,ht:ht,hd:hd,hk:hk,closed:req>0&&rd===req&&!!d.g&&!!d.q};
}
function overall(){
  var req=0,rd=0,closed=0;
  WEEKS.forEach(function(w){var s=weekStats(w);req+=s.req;rd+=s.rd;if(s.closed)closed++});
  return {req:req,rd:rd,closed:closed,pct:req?Math.round(100*rd/req):0};
}
function currentWeek(){
  for(var i=0;i<WEEKS.length;i++){var s=weekStats(WEEKS[i]);if(s.rd<s.req)return i}
  return LAST;

function planWeek(){
  var st=parseYmd(state.settings.start);if(!st)return null;
  var d=Math.floor((startOfDay(new Date())-st)/86400000);
  if(d<0)return -1-(-d);
  if(d<5)return 0;
  return Math.min(LAST,1+Math.floor((d-5)/7));
}
function streak(){

  while(state.days[ymd(d)]>0){s++;d.setDate(d.getDate()-1)}

}

}

function setStatus(s){state.status=s;var el=$("#status");if(el)el.textContent=s==="saving"?"Сохраняю…":s==="saved"?"Сохранено":s==="error"?"Не сохранено":""}
function dirty(path){var q=queue.get(path);return !!timers[path]||!!(q&&(q.busy||q.next))}
function persist(path,data){
  if(!db){localSave();setStatus("saved");return}
  var q=queue.get(path);if(!q){q={busy:false,next:null};queue.set(path,q)}
  q.next=data;
  if(!q.busy)pump(path,q);
}
async function pump(path,q){
  q.busy=true;setStatus("saving");
  while(q.next){
    var d=q.next;q.next=null;
    try{await db.doc(path).set(d);setStatus("saved")}
    catch(e){
      if(e&&e.code==="unavailable"){
        await new Promise(function(r){setTimeout(r,600+Math.random()*600)});
        try{await db.doc(path).set(d);setStatus("saved");continue}catch(e2){e=e2}
      }
      setStatus("error");state.err=(e&&e.code)||"error";
      if(e&&(e.code==="invalid_argument"||e.code==="revoked")){state.readOnly=true}
      renderBanner();
    }
  }
  q.busy=false;
}

  if(cur[key])delete cur[key];else cur[key]=1;
  state.done[id]=cur;render();

}
function adjustToday(delta){
  if(!state.ready||state.readOnly)return;
  var k=ymd(new Date()),old=state.days[k]||0;
  var v=Math.max(0,Math.min(16,Math.round((old+delta)*2)/2));
  if(v===old)return;
  state.days[k]=v;render();
  var path="days/"+k;
  clearTimeout(timers[path]);
  timers[path]=setTimeout(function(){delete timers[path];persist(path,{h:state.days[k]||0,updatedAt:new Date().toISOString()})},500);
  setStatus("saving");
}

}

  var h=state.days[ymd(new Date())]||0,g=state.settings.goal,dis=state.readOnly?" disabled":"";
  return '<section class="card today" aria-label="Часы за сегодня">'
    +'<div class="row"><div class="grow"><div class="kicker">Сегодня</div><div class="val">'+fmt(h)+' ч <span class="goal">из '+fmt(g)+' ч</span></div></div></div>'
    +'<div style="margin-top:10px">'+bar(g?100*h/g:0,true)+'</div>'
    +'<div class="btns"><button class="btn" data-act="h" data-d="-0.5"'+dis+' aria-label="Минус полчаса">−0,5</button>'
    +'<button class="btn primary" data-act="h" data-d="0.5"'+dis+' aria-label="Плюс полчаса">+0,5</button>'
    +'<button class="btn primary" data-act="h" data-d="1"'+dis+' aria-label="Плюс час">+1 ч</button></div>'
    +'</section>';
}
function taskRow(key,title,hrs,isStar,on,desc,okey){
  var op=!!(desc&&state.open[okey]);
  var h='<div class="trow"><button class="task" role="checkbox" aria-checked="'+(on?'true':'false')+'" data-act="toggle" data-k="'+key+'"'+(state.readOnly?' disabled':'')+'>'
    +'<span class="box">'+CHECK+'</span>'
    +'<span class="tt">'+(isStar?'<span class="star" aria-label="необязательное">★ </span>':'')+esc(title)+'</span>'
    +(hrs!=null?'<span class="hrs">'+fmt(hrs)+' ч</span>':'')
    +'</button>'
    +(desc?'<button class="info" data-act="info" data-k="'+okey+'" aria-expanded="'+op+'" aria-label="'+(op?'Скрыть':'Показать')+' описание задания">'+(op?'−':'i')+'</button>':'')
    +'</div>';
  if(op)h+='<div class="tdesc mat">'+desc+'</div>';
  return h;
}
function td(n,i){return MAT&&MAT.weeks[n]?MAT.weeks[n].t[i]||null:null}
function weekView(){
  var w=WEEKS[state.week],s=weekStats(w),d=state.done[wid(w.n)]||{},cur=currentWeek();
  var h=topCard()+todayCard();
  h+='<div class="weeknav"><button class="icon" data-act="prev" aria-label="Предыдущая неделя"'+(state.week===0?' disabled':'')+'>‹</button>'
    +'<div class="wtitle"><div class="kicker">Неделя '+w.n+' из '+LAST+(w.n===cur?'<span class="tag">сейчас</span>':'')+'</div><h2>'+esc(w.t)+'</h2></div>'
    +'<button class="icon" data-act="next" aria-label="Следующая неделя"'+(state.week===LAST?' disabled':'')+'>›</button></div>';
  if(MAT)h+='<button class="btn primary wide" data-act="read" data-n="'+w.n+'" style="margin:0 0 12px">Читать материал недели</button>';
  h+='<section class="card">';
  h+='<div class="row" style="margin-bottom:8px"><div class="grow kicker">Основные: '+s.rd+' из '+s.req+(s.hk&&s.ht?' · '+fmt(s.hd)+' из '+fmt(s.ht)+' ч':'')+'</div></div>'+bar(s.req?100*s.rd/s.req:0,true);
  h+='<div style="margin-top:8px">';
  w.tasks.forEach(function(t,i){if(!t.s)h+=taskRow("t"+(i+1),t.t,t.h,false,!!d["t"+(i+1)],td(w.n,i),w.n+":"+i)});
  h+='</div>';
  if(s.op){
    h+='<div class="group">Необязательные (★) · '+s.od+' из '+s.op+'</div>';
    w.tasks.forEach(function(t,i){if(t.s)h+=taskRow("t"+(i+1),t.t,t.h,true,!!d["t"+(i+1)],td(w.n,i),w.n+":"+i)});
  }
  h+='<div class="group">Завершение недели</div>';
  FIX.forEach(function(f){if(f[0]==="m"&&!MAT)return;h+=taskRow(f[0],f[1],null,false,!!d[f[0]])});
  if(s.closed)h+='<div class="closed">Неделя закрыта. Можно переходить к следующей.</div>';
  h+='</section>';
  return h;
}
function libView(){
  var h='<section class="card"><h2 style="margin-bottom:6px">Справочные разделы</h2>';
  var order=["intro","track","qa","ready","res"];
  order.forEach(function(id){var p=MAT.pages[id];if(p)h+='<button class="wrow" data-act="page" data-id="'+id+'"><span class="wmain"><span class="wt" style="margin:0;white-space:normal">'+esc(p.title)+'</span></span><span class="wc">›</span></button>'});
  h+='</section><section class="card"><h2 style="margin-bottom:6px">Материалы по неделям</h2>';
  WEEKS.forEach(function(w){h+='<button class="wrow" data-act="read" data-n="'+w.n+'"><span class="num">'+w.n+'</span><span class="wmain"><span class="wt" style="margin:0;white-space:normal">'+esc(w.t)+'</span></span><span class="wc">›</span></button>'});
  return h+'</section>';
}
function readerView(){
  var r=state.reader,title,body,isW=r.k==="w";
  if(isW){title="Неделя "+r.n+". "+WEEKS[r.n].t;body=MAT.weeks[r.n].h}
  else{title=MAT.pages[r.id].title;body=MAT.pages[r.id].h}
  var h='<div class="rhead"><button class="btn" data-act="rback">‹ Назад</button><span class="grow"></span>'
    +(isW?'<button class="icon" data-act="rprev" aria-label="Предыдущая неделя"'+(r.n===0?' disabled':'')+'>‹</button><button class="icon" data-act="rnext" aria-label="Следующая неделя"'+(r.n===LAST?' disabled':'')+'>›</button>':'')
    +'</div><article class="card mat"><h1 class="rt">'+esc(title)+'</h1>'+body+'</article>';
  if(isW){
    var on=!!((state.done[wid(r.n)]||{}).m);
    h+='<button class="btn '+(on?'':'primary ')+'wide" data-act="rdone"'+(state.readOnly?' disabled':'')+'>'+(on?'Материал отмечен прочитанным':'Отметить материал прочитанным')+'</button>';
  }
  return h;
}
function allView(){
  var cur=currentWeek(),h='<div class="kicker" style="margin:4px 0 10px">Нажми на неделю, чтобы открыть задания</div>';
  WEEKS.forEach(function(w){
    var s=weekStats(w);
    h+='<button class="wrow'+(w.n===cur?' cur':'')+'" data-act="open" data-n="'+w.n+'"><span class="num">'+w.n+'</span>'
      +'<span class="wmain"><span class="wt">'+esc(w.t)+'</span>'+bar(s.req?100*s.rd/s.req:0,true)+'</span>'
      +'<span class="wc">'+(s.closed?CHECK.replace('<svg','<svg aria-label="закрыта"'):s.rd+'/'+s.req)+'</span></button>';
  });
  return h;
}
function chartSvg(days){
  var W=340,H=150,base=116,top=16,N=days.length,slot=W/N,bw=16,goal=state.settings.goal;
  var max=Math.max(goal*1.3,1);days.forEach(function(x){if(x.h>max)max=x.h});
  function y(v){return base-(v/max)*(base-top)}
  var pick=state.pick==null?N-1:state.pick,tk=ymd(new Date());
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Часы учёбы за последние '+N+' дней">';
  var gy=y(goal);
  s+='<rect class="selbg" x="'+(slot*pick)+'" y="2" width="'+slot+'" height="'+(base+26)+'" rx="6"/>';
  s+='<line class="gl" x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'"/>';
  s+='<line class="bs" x1="0" x2="'+W+'" y1="'+base+'" y2="'+base+'"/>';
  days.forEach(function(x,i){
    var cx=slot*i+slot/2,bx=cx-bw/2;
    if(x.h>0){
      var yy=y(x.h),hh=base-yy;
      if(hh>=5)s+='<path class="bar-m" d="M'+bx+','+base+' V'+(yy+4)+' Q'+bx+','+yy+' '+(bx+4)+','+yy+' H'+(bx+bw-4)+' Q'+(bx+bw)+','+yy+' '+(bx+bw)+','+(yy+4)+' V'+base+' Z"/>';
      else s+='<rect class="bar-m" x="'+bx+'" y="'+(base-hh)+'" width="'+bw+'" height="'+hh+'"/>';
    }
    s+='<text class="tick'+(i===pick?' sel':'')+'" x="'+cx+'" y="'+(base+16)+'" text-anchor="middle">'+x.d.getDate()+'</text>';
    s+='<rect class="hit" data-act="pick" data-i="'+i+'" x="'+(slot*i)+'" y="0" width="'+slot+'" height="'+(base+24)+'" tabindex="0" role="button" aria-label="'+esc(x.d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})+": "+fmt(x.h)+" ч")+'"/>';
  });
  return s+'</svg>';
}
function daysView(){
  var days=lastDays(14),pick=state.pick==null?days.length-1:state.pick,p=days[pick];
  var total=0,active=0;Object.keys(state.days).forEach(function(k){var v=state.days[k];if(v>0){total+=v;active++}});
  var dis=state.readOnly?' disabled':'';
  var h='<section class="card"><h2 style="margin-bottom:8px">Последние 14 дней</h2>'+chartSvg(days)
    +'<div class="kicker" style="display:flex;align-items:center;gap:8px"><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="var(--axis)" stroke-width="2"/></svg>цель на день: '+fmt(state.settings.goal)+' ч</div>'
    +'<div class="readout">'+esc(p.d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"}))+': <b>'+fmt(p.h)+' ч</b></div>'
    +'<details><summary>Показать таблицей</summary><table><thead><tr><th>День</th><th class="n">Часы</th></tr></thead><tbody>';
  days.slice().reverse().forEach(function(x){h+='<tr><td>'+esc(x.d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"}))+'</td><td class="n">'+fmt(x.h)+'</td></tr>'});
  h+='</tbody></table></details></section>';
  h+='<section class="card"><h2>Итого</h2><div class="stats"><div class="stat"><b>'+fmt(total)+' ч</b><span>всего</span></div>'
    +'<div class="stat"><b>'+active+'</b><span>'+plural(active,"день","дня","дней")+' с учёбой</span></div>'
    +'<div class="stat"><b>'+(active?fmt(total/active):'0')+' ч</b><span>в такой день</span></div></div></section>';
  h+='<section class="card"><h2>Настройки</h2>'
    +'<div class="setrow"><label class="f" for="start">Дата старта курса (первый день недели 0)</label><input id="start" type="date" value="'+esc(state.settings.start||"")+'"'+dis+'></div>'
    +'<div class="setrow"><label class="f">Цель на день</label><div class="stepper"><button class="icon" data-act="goal" data-d="-0.5"'+dis+' aria-label="Меньше">−</button><b>'+fmt(state.settings.goal)+' ч</b><button class="icon" data-act="goal" data-d="0.5"'+dis+' aria-label="Больше">+</button></div></div>'
    +'<p class="kicker" style="margin:14px 0 0">Неделя 0 длится 5 дней, дальше каждая неделя по 7. Дата нужна только для сравнения с планом. '+(state.mode==="db"?'Прогресс может прочитать Claude: напиши в чате «посмотри мой прогресс».':'Прогресс хранится на этом устройстве. Раз в неделю делай резервную копию ниже.')+'</p></section>';
  if(state.mode!=="db"){
    h+='<section class="card"><h2>Резервная копия</h2><p class="kicker" style="margin:8px 0 12px">Нажми «Сделать копию», выдели текст и сохрани его в заметках или отправь себе. Чтобы восстановить, вставь текст в поле и нажми «Восстановить».</p>'
      +'<textarea id="bk" rows="5" spellcheck="false" aria-label="Текст резервной копии">'+esc(state.bk)+'</textarea>'
      +'<div class="btns2"><button class="btn" data-act="export">Сделать копию</button><button class="btn" data-act="import">Восстановить</button></div><div id="bkmsg" class="kicker" role="status" style="margin-top:8px"></div></section>';
  }
  return h;
}
function renderBanner(){
  var b=$("#banner"),t="";
  if(state.mode==="local")t="Прогресс сейчас хранится только в этом браузере. Открой страницу из аккаунта, чтобы он сохранялся и был виден на всех устройствах.";
  else if(state.mode==="stuck")t="Не удаётся загрузить прогресс. Обнови страницу, записи пока отключены, чтобы ничего не затереть.";
  else if(state.readOnly)t="Режим просмотра: изменения сохраняться не будут.";
  else if(state.status==="error")t="Не удалось сохранить последнее изменение. Проверь соединение и повтори.";
  b.innerHTML=t?'<div class="note" role="alert">'+esc(t)+'</div>':"";
}
function render(){
  var y=window.scrollY,v=$("#view");
  if(!state.ready)v.innerHTML='<div class="card empty">'+(state.mode==="stuck"?'Прогресс не загрузился.':'Загружаю прогресс…')+'</div>';
  else if(state.reader&&MAT)v.innerHTML=readerView();
  else v.innerHTML=state.tab==="week"?weekView():state.tab==="lib"&&MAT?libView():state.tab==="all"?allView():daysView();
  document.querySelectorAll("nav.tabs button").forEach(function(b){if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  renderBanner();
  window.scrollTo(0,y);
}

/* ---------- события ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;state.reader=null;render();window.scrollTo(0,0);return}
  var a=t.dataset.act;
  if(a==="toggle")toggle(t.dataset.k);
  else if(a==="prev"){if(state.week>0){state.week--;render()}}
  else if(a==="next"){if(state.week<LAST){state.week++;render()}}
  else if(a==="open"){state.week=+t.dataset.n;state.tab="week";render();window.scrollTo(0,0)}
  else if(a==="h")adjustToday(parseFloat(t.dataset.d));
  else if(a==="goal")setGoal(parseFloat(t.dataset.d));
  else if(a==="pick"){state.pick=+t.dataset.i;render()}
  else if(a==="info"){state.open[t.dataset.k]=!state.open[t.dataset.k];render()}
  else if(a==="read"){state.reader={k:"w",n:+t.dataset.n};render();window.scrollTo(0,0)}
  else if(a==="page"){state.reader={k:"p",id:t.dataset.id};render();window.scrollTo(0,0)}
  else if(a==="rback"){state.reader=null;render();window.scrollTo(0,0)}
  else if(a==="rprev"){if(state.reader.n>0){state.reader={k:"w",n:state.reader.n-1};render();window.scrollTo(0,0)}}
  else if(a==="rnext"){if(state.reader.n<LAST){state.reader={k:"w",n:state.reader.n+1};render();window.scrollTo(0,0)}}
  else if(a==="rdone")toggle("m",state.reader.n);
  else if(a==="export")doExport();
  else if(a==="import")doImport();
});
document.addEventListener("input",function(e){if(e.target.id==="bk")state.bk=e.target.value});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("rect[data-act=pick]")){e.preventDefault();state.pick=+e.target.dataset.i;render()}
});
document.addEventListener("change",function(e){
  if(e.target.id==="start"){
    var v=e.target.value;state.settings.start=parseYmd(v)?v:"";saveSettings();render();
  }
});

/* ---------- резервная копия ---------- */
function bkMsg(t){var m=$("#bkmsg");if(m)m.textContent=t}
function doExport(){
  state.bk=JSON.stringify({v:1,done:state.done,days:state.days,settings:state.settings});
  var ta=$("#bk");if(!ta)return;
  ta.value=state.bk;ta.focus();ta.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  bkMsg(ok?"Копия готова и скопирована. Вставь её в заметки.":"Копия готова. Выдели текст в поле и скопируй его.");
}
function doImport(){
  var o;
  try{o=JSON.parse(state.bk)}catch(e){bkMsg("Не получилось прочитать текст. Вставь его целиком, как он был.");return}
  if(!o||o.v!==1||typeof o.done!=="object"||typeof o.days!=="object"){bkMsg("Это не похоже на копию трекера.");return}
  var nd={},ny={};
  Object.keys(o.done||{}).forEach(function(k){if(/^w\d{2}$/.test(k))nd[k]=cleanDone(o.done[k])});
  Object.keys(o.days||{}).forEach(function(k){var v=o.days[k];if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&typeof v==="number"&&isFinite(v))ny[k]=Math.max(0,Math.min(16,v))});
  state.done=nd;state.days=ny;
  var st=o.settings||{};
  state.settings.start=parseYmd(st.start)?st.start:"";
  state.settings.goal=(typeof st.goal==="number"&&st.goal>=1&&st.goal<=8)?st.goal:3.5;
  localSave();state.bk="";render();bkMsg("Готово, прогресс восстановлен.");
}

window.__back=function(){
  if(state.reader){state.reader=null;render();return true}
  if(state.tab!=="week"){state.tab="week";render();return true}
  return false;
};
if(!MAT){var lt=document.getElementById("libtab");if(lt)lt.remove()}

/* ---------- запуск ---------- */
function becomeReady(){
  if(state.ready)return;
  state.ready=true;
  if(state.week==null)state.week=currentWeek();
  render();
}
function mergeKeepDirty(prefix,fresh,old){
  Object.keys(old).forEach(function(id){if(dirty(prefix+id))fresh[id]=old[id]});
  return fresh;
}
function subscribe(){
  var got={w:0,d:0,m:0};
  function chk(){if(got.w&&got.d&&got.m)becomeReady()}
  function onErr(e){state.err=(e&&e.code)||"error";if(!state.ready){state.mode="stuck";render()}else{state.readOnly=true;renderBanner()}}
  db.collection("weeks").onSnapshot(function(s){
    var m={};
    s.docs.forEach(function(x){var o=x.data();if(o&&o.done&&typeof o.done==="object")m[x.id]=cleanDone(o.done)});
    state.done=mergeKeepDirty("weeks/",m,state.done);
    got.w=1;if(state.ready)render();else chk();
  },onErr);
  db.collection("days").onSnapshot(function(s){
    var m={};
    s.docs.forEach(function(x){var o=x.data();if(o&&typeof o.h==="number"&&isFinite(o.h)&&/^\d{4}-\d{2}-\d{2}$/.test(x.id))m[x.id]=Math.max(0,Math.min(16,o.h))});
    state.days=mergeKeepDirty("days/",m,state.days);
    got.d=1;if(state.ready)render();else chk();
  },onErr);
  db.doc("meta/settings").onSnapshot(function(s){
    var o=s.exists?s.data():null;
    if(o&&!dirty("meta/settings")){
      state.settings.start=parseYmd(o.start)?o.start:"";
      if(typeof o.goal==="number"&&o.goal>=1&&o.goal<=8)state.settings.goal=o.goal;
    }
    got.m=1;if(state.ready)render();else chk();
  },onErr);
  setTimeout(function(){if(!state.ready){state.mode="stuck";render()}},8000);
}
async function init(){
  render();
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){
    localLoad();state.mode=window.__APP__?"app":"local";state.ready=true;state.week=currentWeek();render();return;
  }
  state.mode="db";
  try{
    var user=await window.claude.use("user");
    if(user){var cw=await user.can("data.write");if(cw===false){state.readOnly=true}}
  }catch(e){}
  subscribe();
}
init();
})();
</script>

</body></html>
